<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela da Conta do Jogador</title>
</head>
<body>
    <h1>Registro de Jogador</h1>
    <br>
    <!--comando de formulário form:post-->
    <form action="/registrar" method="post"></form>
    <div> <!--Divisória Nome-->
        <label for="user-name">Nome do Jogador</label>
        <input type="text" id="user-name" placeholder="Ex: nome da silva" required>

    </div>
    <br>
    <div> <!--Divisória Email-->
        <label for="user-email">Email</label>
        <input type="email" id="user-email" placeholder="Ex: nome@gmail.com" required>
        
    </div>
    <br>
    <div> <!--Divisória Senha-->
        <label for="user-pin">Senha de Acesso</label>
        <input type="password" id="user-pin" name="user-pin" minlength="4" required>
        
    </div>
    <br>
    <button type="submit">Enviar cadastro</button>
</body>
</html>
